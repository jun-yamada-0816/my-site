<title>新潟市 カフェ一覧（西区・中央区）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --accent: #6f4e37;
    --accent-light: #f5ede4;
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --border: #e6ddd2;
    --text: #3a2e26;
    --muted: #8a7b6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--accent);
    color: #fff;
    padding: 16px 16px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 {
    margin: 0 0 2px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  header p {
    margin: 0 0 12px;
    font-size: 0.75rem;
    opacity: 0.85;
  }
  .search-box {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    outline: none;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .tab.active {
    background: #fff;
    color: var(--accent);
  }
  .count-bar {
    padding: 10px 16px 0;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .list {
    padding: 10px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-size: 0.98rem;
    font-weight: 700;
    line-height: 1.35;
  }
  .badge {
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.nishi { background: #e4f0e9; color: #2f6b45; }
  .badge.chuo  { background: #eae4f5; color: #5b3f8f; }
  .card-address {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .card-link:active { opacity: 0.6; }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* ══════════════════════════════════════════════════════════
     星と海 共通の見た目
     ── 分析・展示会・カフェ一覧の3ページで同じものを使っています。
        色や形はここだけを直せば3ページとも変わります。
     ══════════════════════════════════════════════════════════ */
  :root{
    --sumi:#2b2f33;      /* 墨 … 本文 */
    --usuzumi:#6f757b;   /* 薄墨 … 補足 */
    --ai:#17456b;        /* 藍 */
    --asagi:#2b7f8c;     /* 浅葱 */
    --fuji:#6b6ba3;      /* 藤 */
    --shu:#b7472a;       /* 朱 … 注意 */
    --washi:#fbf9f4;     /* 和紙 … カード */
    --kinari:#f2efe7;    /* 生成り … 地 */
    --keisen:rgba(43,47,51,.13);
  }
  html, body{
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(23,69,107,.07), transparent 62%),
      radial-gradient(820px 520px at 92% -4%, rgba(43,127,140,.06), transparent 62%),
      var(--kinari) !important;
    color: var(--sumi) !important;
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif !important;
    letter-spacing:.03em;
  }
  h1, h2, h3, .mincho{
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif !important;
    font-weight:500 !important;
    letter-spacing:.09em;
  }
  /* 上の帯。3ページとも同じ形にしています */
  .site-bar{
    display:flex; align-items:center; gap:.9rem;
    padding:.85rem 1rem;
    background:rgba(251,249,244,.88);
    border-bottom:1px solid var(--keisen);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:60;
  }
  .site-bar a.home{
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
    color:var(--ai); text-decoration:none; letter-spacing:.3em; font-size:.9rem; white-space:nowrap;
  }
  .site-bar .sep{ width:1px; height:1rem; background:var(--keisen); }
  .site-bar .here{ font-size:.75rem; letter-spacing:.22em; color:var(--usuzumi); white-space:nowrap; }

  /* ── カフェ一覧ページ ───────────────────── */
  header{
    background:rgba(251,249,244,.92) !important;
    color:var(--sumi) !important;
    border-bottom:1px solid var(--keisen);
    box-shadow:none !important;
    padding:14px 16px 12px !important;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  header h1{ font-size:1.1rem !important; letter-spacing:.12em; color:var(--sumi) !important; }
  header p{ color:var(--usuzumi) !important; opacity:1 !important; font-size:.72rem !important; letter-spacing:.06em; }
  .search-box{
    background:rgba(255,255,255,.7) !important;
    border:1px solid var(--keisen) !important; border-radius:2px !important;
    color:var(--sumi); font-size:16px !important;
  }
  .search-box::placeholder{ color:#a9a396; }
  .search-box:focus{ border-color:var(--ai) !important; box-shadow:0 0 0 3px rgba(23,69,107,.10); }
  .tabs{ gap:3px !important; background:rgba(255,255,255,.55); border:1px solid var(--keisen); padding:3px; border-radius:2px; }
  .tab{
    background:transparent !important; border-radius:1px !important;
    color:var(--usuzumi) !important; font-weight:400 !important; letter-spacing:.12em;
    transition:background .25s, color .25s;
  }
  .tab.active{ background:var(--ai) !important; color:var(--washi) !important; font-weight:500 !important; }
  .count-bar{ color:var(--usuzumi) !important; letter-spacing:.08em; }
  .card{
    background:var(--washi) !important; border:1px solid var(--keisen) !important;
    border-radius:2px !important;
  }
  .card-name{
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
    font-weight:500 !important; letter-spacing:.06em; color:var(--sumi);
  }
  .card-address{ color:var(--usuzumi) !important; line-height:1.85 !important; }
  .badge{ border-radius:2px !important; font-weight:500 !important; letter-spacing:.1em; }
  .badge.nishi{ background:rgba(43,127,140,.10) !important; color:var(--asagi) !important; }
  .badge.chuo { background:rgba(107,107,163,.12) !important; color:var(--fuji) !important; }
  .card-link{ color:var(--ai) !important; font-weight:500 !important; letter-spacing:.08em; }
  .empty{ color:var(--usuzumi) !important; }
</style>
</head>

let currentArea = "all";
let currentQuery = "";

function render() {
  const list = document.getElementById("list");
  const countBar = document.getElementById("countBar");
  const q = currentQuery.trim().toLowerCase();

  const filtered = CAFES.filter(c => {
    const areaOk = currentArea === "all" || c.area === currentArea;
    if (!areaOk) return false;
    if (!q) return true;
    return c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q);
  });

  countBar.textContent = filtered.length + " 件表示中";

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">該当するカフェが見つかりません</div>';
    return;
  }

  list.innerHTML = filtered.map(c => {
    const badgeClass = c.area === "西区" ? "nishi" : "chuo";
    return `
      <div class="card">
        <div class="card-top">
          <div class="card-name">${escapeHtml(c.name)}</div>
          <div class="badge ${badgeClass}">${escapeHtml(c.area)}</div>
        </div>
        <div class="card-address">${escapeHtml(c.address)}</div>
        <a class="card-link" href="${c.map}" target="_blank" rel="noopener noreferrer">Google Map で開く →</a>
      </div>
    `;
  }).join("");
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentArea = tab.dataset.area;
    render();
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  currentQuery = e.target.value;
  render();
});

render();
</script>
</body>
</html>
