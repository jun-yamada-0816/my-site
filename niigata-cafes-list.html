<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新潟市 カフェ一覧（西区・中央区）</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js" integrity="sha384-ARQ6JMpleHd1EQUxL9V4CSjKPqSyRfswRYBiVKcn1MT6zUD+BdOm/NYzic64PuF4" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #6f4e37;
    --accent-light: #f5ede4;
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --border: #e6ddd2;
    --text: #3a2e26;
    --muted: #8a7b6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--accent);
    color: #fff;
    padding: 16px 16px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 {
    margin: 0 0 2px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  header p {
    margin: 0 0 12px;
    font-size: 0.75rem;
    opacity: 0.85;
  }
  .search-box {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    outline: none;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .tab.active {
    background: #fff;
    color: var(--accent);
  }
  .count-bar {
    padding: 10px 16px 0;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .list {
    padding: 10px 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-name {
    font-size: 0.98rem;
    font-weight: 700;
    line-height: 1.35;
  }
  .badge {
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.nishi { background: #e4f0e9; color: #2f6b45; }
  .badge.chuo  { background: #eae4f5; color: #5b3f8f; }
  .card-address {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
  }
  .card-link:active { opacity: 0.6; }
  .empty {
    text-align: center;
    padding: 40px 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  /* ══════════════════════════════════════════════════════════
     星の海 共通の見た目
     ── 分析・展示会・カフェ一覧の3ページで同じものを使っています。
        色や形はここだけを直せば3ページとも変わります。
     ══════════════════════════════════════════════════════════ */
  :root{
    --sumi:#2b2f33;      /* 墨 … 本文 */
    --usuzumi:#6f757b;   /* 薄墨 … 補足 */
    --ai:#17456b;        /* 藍 */
    --asagi:#2b7f8c;     /* 浅葱 */
    --fuji:#6b6ba3;      /* 藤 */
    --shu:#b7472a;       /* 朱 … 注意 */
    --washi:#fbf9f4;     /* 和紙 … カード */
    --kinari:#f2efe7;    /* 生成り … 地 */
    --keisen:rgba(43,47,51,.13);
  }
  html, body{
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(23,69,107,.07), transparent 62%),
      radial-gradient(820px 520px at 92% -4%, rgba(43,127,140,.06), transparent 62%),
      var(--kinari) !important;
    color: var(--sumi) !important;
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif !important;
    letter-spacing:.03em;
  }
  h1, h2, h3, .mincho{
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif !important;
    font-weight:500 !important;
    letter-spacing:.09em;
  }
  /* 上の帯。3ページとも同じ形にしています */
  .site-bar{
    display:flex; align-items:center; gap:.9rem;
    padding:.85rem 1rem;
    background:rgba(251,249,244,.88);
    border-bottom:1px solid var(--keisen);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:60;
  }
  .site-bar a.home{
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
    color:var(--ai); text-decoration:none; letter-spacing:.3em; font-size:.9rem; white-space:nowrap;
  }
  .site-bar .sep{ width:1px; height:1rem; background:var(--keisen); }
  .site-bar .here{ font-size:.75rem; letter-spacing:.22em; color:var(--usuzumi); white-space:nowrap; }

  /* ── カフェ一覧ページ ───────────────────── */
  header{
    background:rgba(251,249,244,.92) !important;
    color:var(--sumi) !important;
    border-bottom:1px solid var(--keisen);
    box-shadow:none !important;
    padding:14px 16px 12px !important;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  header h1{ font-size:1.1rem !important; letter-spacing:.12em; color:var(--sumi) !important; }
  header p{ color:var(--usuzumi) !important; opacity:1 !important; font-size:.72rem !important; letter-spacing:.06em; }
  .search-box{
    background:rgba(255,255,255,.7) !important;
    border:1px solid var(--keisen) !important; border-radius:2px !important;
    color:var(--sumi); font-size:16px !important;
  }
  .search-box::placeholder{ color:#a9a396; }
  .search-box:focus{ border-color:var(--ai) !important; box-shadow:0 0 0 3px rgba(23,69,107,.10); }
  .tabs{ gap:3px !important; background:rgba(255,255,255,.55); border:1px solid var(--keisen); padding:3px; border-radius:2px; }
  .tab{
    background:transparent !important; border-radius:1px !important;
    color:var(--usuzumi) !important; font-weight:400 !important; letter-spacing:.12em;
    transition:background .25s, color .25s;
  }
  .tab.active{ background:var(--ai) !important; color:var(--washi) !important; font-weight:500 !important; }
  .count-bar{ color:var(--usuzumi) !important; letter-spacing:.08em; }
  .card{
    background:var(--washi) !important; border:1px solid var(--keisen) !important;
    border-radius:2px !important;
  }
  .card-name{
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
    font-weight:500 !important; letter-spacing:.06em; color:var(--sumi);
  }
  .card-address{ color:var(--usuzumi) !important; line-height:1.85 !important; }
  .badge{ border-radius:2px !important; font-weight:500 !important; letter-spacing:.1em; }
  .badge.nishi{ background:rgba(43,127,140,.10) !important; color:var(--asagi) !important; }
  .badge.chuo { background:rgba(107,107,163,.12) !important; color:var(--fuji) !important; }
  .card-link{ color:var(--ai) !important; font-weight:500 !important; letter-spacing:.08em; }
  .empty{ color:var(--usuzumi) !important; }

  /* ══════════════════════════════════════════════════════════
     モバイルファーストのレスポンシブ
     ── ここから上の見た目が「スマホで見たときの基本形」です。
        画面が広くなったときだけ、下の min-width で足しています。
     ══════════════════════════════════════════════════════════ */

  /* ── スマホ（基本）──────────────────────── */
  html{ -webkit-text-size-adjust:100%; }
  body{
    overflow-x:hidden;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  /* iOS で入力欄に触れたときに画面が勝手に拡大されないよう 16px 以上にする */
  .search-box{ font-size:16px; }
  /* 指で押すものは 44px 以上 */
  .tab{ min-height:44px; display:flex; align-items:center; justify-content:center; }
  .card-link{ min-height:44px; align-items:center; }
  /* ノッチのある端末で、見出しや帯が切り欠きに潜らないように */
  .site-bar{
    padding-left:max(1rem, env(safe-area-inset-left));
    padding-right:max(1rem, env(safe-area-inset-right));
  }
  /* header 側は上の共通指定が padding を !important で持っているので、こちらも合わせる */
  header, .count-bar, .list{
    padding-left:max(12px, env(safe-area-inset-left)) !important;
    padding-right:max(12px, env(safe-area-inset-right)) !important;
  }
  /* 長い店名や住所で横スクロールが出ないように */
  .card-name, .card-address{ overflow-wrap:anywhere; }

  /* ── 大きめのスマホ・タブレット縦 ────────── */
  @media (min-width:640px){
    /* 中身は真ん中に寄せる。画面いっぱいに伸ばすと住所が読みにくい */
    header, .count-bar, .list{
      padding-left:max(16px, calc((100% - 900px) / 2)) !important;
      padding-right:max(16px, calc((100% - 900px) / 2)) !important;
    }
    /* カードを2枚ずつ並べる */
    .list{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
    /* 高さをそろえて、リンクは下端に落とす */
    .card-link{ margin-top:auto; }
    /* 「見つかりませんでした」は列をまたいで真ん中に */
    .empty{ grid-column:1 / -1; }
    header h1{ font-size:1.3rem !important; }
  }

  /* ── PC ─────────────────────────────────── */
  @media (min-width:1024px){
    .list{ grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; }
    .card{ padding:14px 16px; }
  }

  /* ── マウスのない端末では hover の見た目を出さない ── */
  @media (hover:none){
    .card:hover{ transform:none; box-shadow:none; }
  }

  /* 上の帯の「星の海」は、スマホでも指で押せる高さにする */
  .site-bar a.home{ display:inline-flex; align-items:center; min-height:44px; }
</style>
</head>
<body>
<div class="site-bar">
  <a class="home" href="./">星の海</a><span class="sep"></span><span class="here">新潟のカフェ一覧</span>
</div>
<header>
  <h1>新潟市 カフェ一覧</h1>
  <p>西区・中央区 <span id="total"></span>／ タップでGoogle Mapを開けます</p>
  <input id="search" class="search-box" type="text" placeholder="店名・住所で検索…" />
  <div class="tabs">
    <div class="tab active" data-area="all">すべて</div>
    <div class="tab" data-area="西区">西区</div>
    <div class="tab" data-area="中央区">中央区</div>
  </div>
</header>
<div class="count-bar" id="countBar">読み込み中…</div>
<div class="list" id="list"></div>

<script>
// 一覧はページに書かず、管理者がログインしているときだけ Supabase の admin_cafes から読む
// （admin-cafes.sql）。ログインはトップページと同じもの（同じサイトなので引き継がれる）。
const SUPABASE_URL      = 'https://qnmzjwgacnfxwlbgwxcr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_BG0n_GkXIwMBUlSN-W5vzA_vb4rbPKq';
let CAFES = [];

function showMessage(text, withHomeLink) {
  const list = document.getElementById("list");
  document.getElementById("countBar").textContent = "";
  list.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty";
  box.textContent = text;
  if (withHomeLink) {
    const a = document.createElement("a");
    a.href = "./";
    a.textContent = "トップページへ";
    a.style.cssText = "display:block;margin-top:12px;color:var(--ai);font-weight:500;";
    box.appendChild(a);
  }
  list.appendChild(box);
}

async function loadCafes() {
  if (!window.supabase) { showMessage("読み込みに失敗しました。通信状態を確かめて、ページを開き直してください。"); return; }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    showMessage("このページは管理者だけが見られます。トップページで管理者としてログインしてから、管理者メニューの「カフェ」を開いてください。", true);
    return;
  }
  const { data, error } = await sb.from("admin_cafes")
    .select("id, area, name, address").order("sort");
  if (error) {
    console.error("admin_cafes:", error);
    showMessage(error.code === "42P01" || error.code === "PGRST205"
      ? "まだ一覧の表がありません。Supabase の SQL Editor で admin-cafes.sql を実行してください。"
      : "一覧を読み込めませんでした。時間をおいて開き直してください。");
    return;
  }
  if (!data.length) {
    showMessage("表示できるカフェがありません。管理者のアカウントでログインしているか確かめてください。", true);
    return;
  }
  CAFES = data;
  document.getElementById("total").textContent = "全" + CAFES.length + "件 ";
  render();
}

// 地図のリンクは店名と住所から作る（DB には URL を置かない）
function mapUrl(c) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.name + " " + c.address);
}

let currentArea = "all";
let currentQuery = "";

function render() {
  const list = document.getElementById("list");
  const countBar = document.getElementById("countBar");
  const q = currentQuery.trim().toLowerCase();

  const filtered = CAFES.filter(c => {
    const areaOk = currentArea === "all" || c.area === currentArea;
    if (!areaOk) return false;
    if (!q) return true;
    return c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q);
  });

  countBar.textContent = filtered.length + " 件表示中";

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">該当するカフェが見つかりません</div>';
    return;
  }

  list.innerHTML = filtered.map(c => {
    const badgeClass = c.area === "西区" ? "nishi" : "chuo";
    return `
      <div class="card">
        <div class="card-top">
          <div class="card-name">${escapeHtml(c.name)}</div>
          <div class="badge ${badgeClass}">${escapeHtml(c.area)}</div>
        </div>
        <div class="card-address">${escapeHtml(c.address)}</div>
        <a class="card-link" href="${escapeHtml(mapUrl(c))}" target="_blank" rel="noopener noreferrer">Google Map で開く →</a>
      </div>
    `;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentArea = tab.dataset.area;
    if (CAFES.length) render();
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  currentQuery = e.target.value;
  if (CAFES.length) render();
});

loadCafes().catch(e => {
  console.error("loadCafes:", e);
  showMessage("一覧を読み込めませんでした。時間をおいて開き直してください。");
});
</script>
</body>
</html>
